# Body size for "arbitrary JSON". Default Play limit is 100 KB.
play.http.parser.maxMemoryBuffer = 10m

# Chunked GET /kv can run longer than a normal request.
play.server.akka.requestTimeout = 10s

# KV store config — shared by both node and router processes.
# Override per-process with -Dkv.role=router, -Dkv.nodeId=node-2, etc.
kv {
  role   = "node"       # node | router
  nodeId = "node-1"

  # Router → node HTTP timeout (connection refused / hung node).
  remoteTimeout = 5s

  # Max bytes of a single NDJSON line from /internal/keys.
  ndjsonMaxFrameLength = 1024

  # All processes that route MUST agree on this ordered list.
  # ModuloPartitioner: owner = nodes[ floorMod(hash(key), nodes.size) ]
  # Reordering or adding/removing nodes remaps keys.
  nodes  = [
    { id = "node-1", url = "http://localhost:7001" }
    { id = "node-2", url = "http://localhost:7002" }
    { id = "node-3", url = "http://localhost:7003" }
  ]
}

play.modules.enabled += "Module"

# Development-only secret key for running the staged binary locally.
# In a real deployment replace this with a long random value via
# -Dplay.http.secret.key=<secret> or an environment variable.
play.http.secret.key = "localdevsecret-change-in-production"
