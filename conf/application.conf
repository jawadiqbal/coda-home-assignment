play.http.parser.maxMemoryBuffer = 10m

# KV store config — used by both node and router processes.
# Stubs are here so Part 2 does not require config changes that break Part 1.
kv {
  role   = "node"       # node | router
  nodeId = "node-1"
  nodes  = [
    { id = "node-1", url = "http://localhost:9000" }
  ]
}

play.modules.enabled += "Module"
